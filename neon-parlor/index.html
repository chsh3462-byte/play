function activate(n){if(live||busy)return;mode=n;$("lobby").hidden=n>=0;$("room").hidden=n<0;tickets=[];exposed=false;player=[];dealer=[];board=[];cardTimes.clear();winUntil=0;
 if(n>=0){let g=games[n];$("title").textContent=g[1]+"　/　"+g[0];$("roomTag").textContent=g[2];$("rules").textContent=g[4]+" 진행 중 창을 닫으면 건 칩은 소진됩니다.";$("rulesBox").open=false;say(n===1?"칩 단위를 고른 뒤 원하는 칸에 베팅하세요.":"칩 단위를 고르고 게임을 시작하세요.");controls()}sync();window.scrollTo(0,0)}
function controls(){
 let actions=$("controls"),stake=$("stakes");actions.replaceChildren();stake.replaceChildren();$("tickets").textContent="";
 if(!live){let l=document.createElement("span");l.className="stake";l.textContent=mode===1?"칩 단위":"베팅 칩";stake.append(l);[10,50,100].forEach(n=>btn("stakes",n,()=>{unit=n;controls()},n===unit?"chosen":""))}
 if(busy){actions.textContent=mode<2?"결과를 기다리는 중…":"카드를 펼치는 중…";return}
 if(mode===1&&!live){for(let col of ["흑","백"])btn("controls",col==="흑"?"● 흑":"○ 백",()=>{choice=col;controls()},choice===col?"chosen":"");
 let sel=document.createElement("select");sel.setAttribute("aria-label","베팅 숫자");for(let n=1;n<=6;n++)sel.add(new Option(n+"번",n));sel.value=numberChoice;sel.onchange=()=>numberChoice=Number(sel.value);actions.append(sel);
 let total=tickets.reduce((s,b)=>s+b.amount,0);btn("controls","칩 추가",()=>{let b=tickets.find(b=>b.color===choice&&b.number===numberChoice);if(b)b.amount+=unit;else tickets.push({color:choice,number:numberChoice,amount:unit});controls()},"",total+unit>balance);btn("controls","지우기",()=>{tickets=[];controls()},"",!total);btn("controls","회전 · "+total,spinWheel,"primary",!total||total>balance);
 $("tickets").textContent=tickets.map(b=>b.color+" "+b.number+"번 · "+b.amount+"칩").join("　|　");return}
 if(!live){btn("controls",mode===0?"릴 돌리기":"카드 받기",start,"primary",balance<unit);return}
 if(mode===2){if(pending){btn("controls","콜 · "+unit,()=>poker("call"),"primary",balance<unit);btn("controls","폴드",()=>poker("fold"))}else{btn("controls","체크",()=>poker("check"),"primary");btn("controls","베팅 · "+unit,()=>poker("bet"),"",balance<unit);btn("controls","폴드",()=>poker("fold"))}}
 if(mode===3){btn("controls","히트",()=>black("hit"),"primary");btn("controls","스탠드",()=>black("stand"));btn("controls","더블",()=>black("double"),"",player.length!==2||balance<unit)}
}
async function start(){if(live||!spend(unit))return;live=true;busy=true;pot=unit;exposed=false;winUntil=0;sync();controls();
 if(mode===0){reels=[rnd(5),rnd(5),rnd(5)];anim={start:now()};say("릴이 회전합니다.");for(let i=0;i<3;i++){await wait(i?440:850);tone(330+i*130,.1,"square")}let mul=slotPay(reels);finish(unit*mul,mul===30?"잭팟! 럭키 세븐":mul===8?"트리플 매치!":mul?"페어 적중":"매치 없음");return}
 dealerContribution=unit;deck=freshDeck();player=[];dealer=[];board=[];street=0;pending=false;cardTimes.clear();say("딜러가 카드를 나눕니다.");
 for(let hand of [player,dealer,player,dealer]){deal(hand);await wait(160)}
 busy=false;
 if(mode===3){let p=points(player),d=points(dealer);if(p===21||d===21){finish(p===d?unit:p===21?unit*2.5:0,p===d?"양쪽 블랙잭 · 무승부":p===21?"내추럴 블랙잭!":"딜러 블랙잭");return}say("내 합계 "+p+"　·　한 장 더 받을까요?")}
 else say("프리플롭　·　내 차례입니다.");controls()
}
async function spinWheel(){let bets=tickets.slice(),total=bets.reduce((s,b)=>s+b.amount,0);if(live||!spend(total))return;live=busy=true;pot=total;sync();controls();lastWheel=rnd(12);let endA=angular+TAU*2+.8,endB=endA+(lastWheel+.5)*TAU/12;
 while(endB>ballAngle-TAU*3)endB-=TAU;anim={start:now(),a:angular,b:ballAngle,endA,endB};say("구슬이 궤도를 돌고 있습니다.");
 for(let i=0;i<12;i++){tone(520-i*18,.035);await wait(85+i*24)}
 angular=endA%TAU;ballAngle=endB%TAU;tickets=[];finish(roulettePay(bets,lastWheel),COLOR(lastWheel)+" "+VALUE(lastWheel)+"번 당첨")}
async function black(action){if(busy||!live)return;busy=true;controls();if(action==="double"){if(!spend(unit)){busy=false;controls();return}pot+=unit}
 if(action!=="stand"){deal(player);await wait(230);if(points(player)>21){finish(0,"버스트 · "+points(player));return}if(action!=="double"&&points(player)<21){say("내 합계 "+points(player));busy=false;controls();return}}
 exposed=true;cardTimes.set(dealer[1],now());say("딜러 차례");await wait(450);while(points(dealer)<17){deal(dealer);await wait(420)}
 let p=points(player),d=points(dealer),won=d>21||p>d;finish(won?pot*2:p===d?pot:0,(won?"플레이어 승":p===d?"무승부":"딜러 승")+" · "+p+" 대 "+d)}
let dealerContribution=0;
async function poker(action){if(busy||!live)return;busy=true;controls();
 if(action==="fold"){finish(0,"플레이어 폴드");return}
 let strength=board.length?Math.floor(best([...dealer,...board])/15**5):(rank(dealer[0])===rank(dealer[1])?2:Math.max(...dealer.map(rank))>=12?1:0);
 if(action==="bet"||action==="call"){if(!spend(unit)){busy=false;controls();return}pot+=unit}
 say("딜러가 생각 중입니다…");await wait(400);
 if(action==="bet"){if(!strength&&rnd(5)===0){finish(pot+dealerContribution,"딜러 폴드 · 팟 획득");return}dealerContribution+=unit}
 if(action==="check"&&balance>=unit&&rnd(100)<(strength?48:18)){dealerContribution+=unit;pending=true;busy=false;say("딜러가 "+unit+"칩을 베팅했습니다.");controls();return}
 pending=false;if(street===3){exposed=true;cardTimes.set(dealer[0],now());cardTimes.set(dealer[1],now());await wait(300);let p=best([...player,...board]),d=best([...dealer,...board]);let size=pot+dealerContribution;finish(p>d?size:p===d?size/2:0,(p>d?"플레이어 승":p===d?"무승부":"딜러 승")+" · 나 "+handName(p)+" / 딜러 "+handName(d));return}
 street++;for(let i=0;i<(street===1?3:1);i++){deal(board);await wait(140)}busy=false;say((action==="bet"?"딜러 콜 · ":action==="check"?"딜러 체크 · ":"콜 · ")+stages[street]+"　내 차례입니다.");controls()}

 rect(x-13,y+13,27,16,"#172a39");rect(x-8,y+12,18,16,"#c4b8ad");rect(x-3,y+16,6,11,"#694153");rect(x-9,y-2,19,15,"#aa7868");rect(x-7,y,15,12,"#edb993");rect(x-9,y-5,17,6,"#453848");rect(x-10,y-2,4,8,"#493948");rect(x+5,y-3,6,6,"#493948");rect(x-5,y+4,3,Math.sin(t*1.8)>.99?1:2,"#544251");rect(x+3,y+4,3,2,"#544251");rect(x-1,y+9,5,1,"#ab7164");rect(x-6,y+13,5,4,"#804158");rect(x+1,y+13,5,4,"#804158")}

 if(mode<2){
  rect(0,123,560,55,"#29283a");rect(0,124,560,4,"#c58b77");for(let i=0;i<8;i++)line(i*88-32,178,160+i*40,128,"#514053");

  chips(114,137,4,t);chips(129,138,2,t);chips(424,138,5,t);
 }else{
  dealerSprite(279,12,t);oval(280,115,275,74,"#1a1928");oval(280,110,271,72,"#a76e5b");oval(280,108,263,67,"#372d38");oval(280,108,258,63,mode===2?"#234e50":"#274254");oval(280,108,240,55,mode===2?"#30605c":"#355267");oval(280,108,238,54,mode===2?"#234e50":"#274254");
  label(mode===2?"HARBOR":"BLUE HOUR",76,107,12,"#89a69c");label(mode===2?"HOLD’EM":"TWENTY ONE",76,120,8,"#89a69c");chips(454,121,4,t);chips(471,123,2,t);
  let h=mode===2;let empty=!player.length;
  if(empty){for(let i=0;i<3;i++)card(254+i*12,84-i*2,null);label("PLACE YOUR CHIPS",280,145,9,ivory)}
  else{label("DEALER",182,53,9,ivory);showHand(dealer,280,32,i=>!exposed&&(h||i===1),t);
  if(h){for(let i=0;i<5;i++){let x=210+i*29;ctx.strokeStyle="#71918a";ctx.strokeRect(x+.5,75.5,24,32)}board.forEach((c,i)=>showHand([c],222+i*29,76,()=>false,t));label(stages[street],384,96,9,ivory)}
  else{label("DEALER   "+(exposed?points(dealer):points(dealer.slice(0,1))+" + ?"),280,84,9,"#becdc3");label("PLAYER   "+points(player),280,103,10,ivory)}

 }
 if(t<winUntil&&!reduced){for(let i=0;i<46;i++){let age=1.8-(winUntil-t),x=280+(noise(i)-.5)*age*420,y=110-age*(65+noise(i+30)*125)+age*age*62;rect(x,y,2,3,[ivory,pink,mint][i%3])}}
}
for(let i=0;i<4;i++){let b=document.createElement("button"),g=games[i];b.className="tile";b.style.setProperty("--accent",g[3]);b.innerHTML='<canvas width="160" height="86" id="tile'+i+'"></canvas><div><small>'+g[0]+'</small><strong>'+g[1]+'<em>↗</em></strong></div>';b.onclick=()=>{tone();activate(i)};$("tiles").append(b)}
$("brand").onclick=$("back").onclick=()=>activate(-1);
